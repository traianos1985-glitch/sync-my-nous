name: NOUS CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "nous-ai-os/android_companion/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: nous-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Block high and critical npm advisories
        run: npm audit --audit-level=high
      - run: npm run check

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nous-ai-os
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nous-ai-os/requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Syntax check
        run: python -m compileall -q executor apps *.py
      - name: Ruff correctness checks
        run: ruff check .
      - name: Legacy security and style findings (advisory)
        continue-on-error: true
        run: ruff check . --select B,S,F401 --output-format concise
      - name: Pytest
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository and Git history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # gitleaks-action v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
