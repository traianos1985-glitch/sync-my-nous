name: NOUS CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "nous-ai-os/android_companion/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: nous-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nous-ai-os
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # actions/setup-python v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nous-ai-os/requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Syntax check
        run: python -m compileall -q executor apps *.py
      - name: Ruff correctness checks
        run: ruff check .
      - name: Legacy security and style findings (advisory)
        continue-on-error: true
        run: ruff check . --select B,S,F401 --output-format concise
      - name: Pytest
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          fetch-depth: 0
      - name: Scan repository and Git history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # gitleaks-action v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
