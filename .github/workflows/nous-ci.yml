name: NOUS CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "android_companion/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: nous-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: nous-ai-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nous-ai-os/requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Syntax check
        run: python -m compileall -q executor apps *.py
      - name: Ruff
        run: ruff check .
      - name: Pytest
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Secret scan
        shell: bash
        run: |
          if grep -rInE "sk-or-v1-[A-Za-z0-9]{20,}" --exclude-dir=.git --exclude-dir=.venv .; then
            echo "::error::Possible API key found in repository"
            exit 1
          fi
