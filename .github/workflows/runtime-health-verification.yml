name: NOUS Runtime Health Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nous-runtime-health-verification
  cancel-in-progress: true

jobs:
  verify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python v7.1.0
        with:
          python-version: "3.12"
      - name: Verify deployed NOUS liveness and readiness
        working-directory: nous-ai-os
        env:
          NOUS_HEALTHCHECK_URL: ${{ secrets.NOUS_HEALTHCHECK_URL }}
          PYTHONPATH: .
        run: python -m executor.runtime_verification
