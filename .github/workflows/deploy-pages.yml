name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /sync-my-nous/

      - name: Generate static entrypoint
        run: |
          css_asset=$(find .output/public/assets -maxdepth 1 -name 'styles-*.css' -print -quit)
          js_asset=$(find .output/public/assets -maxdepth 1 -name 'index-*.js' -print -quit)
          test -n "$css_asset"
          test -n "$js_asset"
          css_path="/sync-my-nous/assets/$(basename "$css_asset")"
          js_path="/sync-my-nous/assets/$(basename "$js_asset")"
          cat > .output/public/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Sync My Nous</title>
              <link rel="stylesheet" href="$css_path" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="$js_path"></script>
            </body>
          </html>
          EOF
          cp .output/public/index.html .output/public/404.html
          test -s .output/public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # upload-pages-artifact v5.0.0
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # deploy-pages v5.0.1

# GitHub Pages must use the GitHub Actions source in repository Settings > Pages.
