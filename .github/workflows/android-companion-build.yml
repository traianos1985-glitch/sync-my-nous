name: Build NOUS Android Companion

on:
  workflow_dispatch:
  push:
    paths:
      - "nous-ai-os/android_companion/**"
      - ".github/workflows/android-companion-build.yml"

permissions:
  contents: read

concurrency:
  group: android-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # setup-java v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # setup-android v4.0.4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # setup-gradle v6.4.0

      - name: Build debug APK
        working-directory: nous-ai-os/android_companion
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # upload-artifact v7.0.2
        with:
          name: nous-companion-debug-apk
          path: nous-ai-os/android_companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
