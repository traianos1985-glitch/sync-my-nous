name: Build NOUS Android Companion

on:
  workflow_dispatch:
  push:
    paths:
      - "nous-ai-os/android_companion/**"
      - ".github/workflows/android-companion-build.yml"

permissions:
  contents: read

concurrency:
  group: android-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: nous-ai-os/android_companion
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nous-companion-debug-apk
          path: nous-ai-os/android_companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
