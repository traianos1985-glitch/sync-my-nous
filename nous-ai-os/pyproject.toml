[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
  "data",
  "generated_apps",
  "forge",
  "executor/plugins",
  "attached_assets",
  "vercel_test_app",
]

[tool.ruff.lint]
# CI checks syntax/runtime hazards, common bug patterns, security findings, and unused imports.
# S101 is ignored for tests below because pytest assertions are expected there.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
