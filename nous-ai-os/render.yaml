services:
  - type: web
    name: nous-ai-os
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: NOUS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NOUS_ALLOW_REMOTE_UPGRADE
        value: "0"
      - key: NOUS_ALLOW_ANONYMOUS
        value: "0"
    disk:
      name: nous-data
      mountPath: /app/data
      sizeGB: 1
